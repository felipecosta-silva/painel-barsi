# Fehmir · robô do histórico gratuito (Yahoo Finance, sem chave)
# Roda todo dia útil depois do fechamento da B3 e grava dados/historico.js no repositório.
# Grátis em repositório público (GitHub Actions). Nenhum segredo/token é usado aqui.
name: Atualizar historico

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19h30 de Brasília, seg-sex
  workflow_dispatch: {}        # botão "Run workflow" para rodar na mão

permissions:
  contents: write

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o rebase no fim precisa achar a base mesmo com commits de outros robôs no meio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar historico (Yahoo)
        run: python tools/atualizar_historico.py
      - name: Varrer mercado inteiro (radar)
        run: python tools/varrer_mercado.py
        continue-on-error: true
      - name: Baixar benchmarks (CDI, IPCA, Ibov)
        run: python tools/benchmarks.py
        continue-on-error: true
      - name: Serie mensal de 10 anos (comparador de ativos)
        run: python tools/historico_mensal.py
        continue-on-error: true
      - name: Salvar se mudou
        run: |
          git config user.name "fehmir-robo"
          git config user.email "fehmir-robo@users.noreply.github.com"
          git add dados/historico.js dados/mercado.js dados/benchmarks.js dados/historico_mensal.js
          git diff --cached --quiet || git commit -m "dados: historico atualizado $(date +%Y-%m-%d)"
          # Os outros robôs (novidades, analista) gravam no main enquanto este roda.
          # Tenta 3 vezes; em conflito num arquivo de dados vence a versão recém-gerada por este robô (-X theirs no rebase).
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Tentativa $i falhou:"; git status --short | head -20
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
