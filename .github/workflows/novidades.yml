# Fehmir · robô de novidades (CVM IPE + Fundos.NET B3 + Gemini API)
# Roda todo dia útil às 20h de Brasília (depois do robô de preços) e grava dados/novidades.js no repositório.
name: Atualizar novidades

on:
  schedule:
    - cron: "0 23 * * 1-5"     # 20h de Brasília, seg-sex (depois do historico das 19h30)
  workflow_dispatch: {}        # botão "Run workflow" para rodar manualmente

permissions:
  contents: write

jobs:
  novidades:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # opcional: variável do repositório para forçar um modelo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar robo de novidades
        run: python tools/novidades.py
      - name: Salvar se mudou
        if: always()   # salva o catálogo mesmo se os resumos falharem
        run: |
          git config user.name "fehmir-robo"
          git config user.email "fehmir-robo@users.noreply.github.com"
          git add dados/novidades.js
          git diff --cached --quiet || git commit -m "dados: novidades $(date +%Y-%m-%d)"
          git pull --rebase origin main && git push
