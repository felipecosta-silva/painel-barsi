# Fehmir · robô de novidades (CVM IPE + Fundos.NET B3 + Gemini API)
# Roda todo domingo às 10h de Brasília e grava dados/novidades.js no repositório.
name: Atualizar novidades

on:
  schedule:
    - cron: "0 13 * * 0"       # 10h de Brasília no domingo
  workflow_dispatch: {}        # botão "Run workflow" para rodar manualmente

permissions:
  contents: write

jobs:
  novidades:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar robo de novidades
        run: python tools/novidades.py
      - name: Salvar se mudou
        run: |
          git config user.name "fehmir-robo"
          git config user.email "fehmir-robo@users.noreply.github.com"
          git add dados/novidades.js
          git diff --cached --quiet || git commit -m "dados: novidades $(date +%Y-%m-%d)"
          git push
