# Fehmir · robô semanal de pareceres (análise fundamentalista via Gemini API)
# Roda todo sábado às 10h de Brasília e grava dados/pareceres.js e dados/licoes_candidatas.js no repositório.
name: Atualizar pareceres semanais

on:
  schedule:
    - cron: "0 13 * * 6"     # 10h de Brasília aos sábados (13h UTC)
  workflow_dispatch: {}        # botão "Run workflow" para rodar manualmente

permissions:
  contents: write

jobs:
  pareceres:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # esperas do Gemini (503/429) e análise de múltiplos ativos
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # opcional: variável do repositório para forçar um modelo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar robo de pareceres
        run: python tools/pareceres.py
      - name: Salvar se mudou
        if: always()   # salva mesmo se houver falhas pontuais em chamadas individuais
        run: |
          git config user.name "fehmir-robo"
          git config user.email "fehmir-robo@users.noreply.github.com"
          git add dados/pareceres.js dados/licoes_candidatas.js
          git diff --cached --quiet || git commit -m "dados: pareceres semanais $(date +%Y-%m-%d)"
          git pull --rebase origin main && git push
